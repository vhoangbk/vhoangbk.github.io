<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao diện App</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .phone-container {
            width: 260px;
            height: 320px;
            background-color: #ffffff;
            border: 4px solid #1f2e45;
            border-radius: 20px;
            box-shadow: 4px 4px 0px 0px #e0e5ea;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            position: relative;
        }

        .notch {
            width: 50px;
            height: 4px;
            background-color: #1f2e45;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .header-webview {
            background-color: #f3f6f9;
            color: #6b7a90;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            width: 100%;
            padding: 10px 0;
            border-radius: 8px;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .icon-a {
            width: 45px;
            height: 45px;
            background-color: #e0f2e9;
            color: #1a6b54;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        .title {
            color: #1a6b54;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .description {
            text-align: center;
            color: #6b7a90;
            font-size: 12px;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .description span {
            display: block;
            color: #8896a6;
        }

        .btn-continue {
            background-color: #318e77;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-continue:hover {
            background-color: #27725f;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="notch"></div>
        
        <div class="header-webview">
            WEBVIEW
        </div>

        <div class="icon-a">A</div>

        <div class="title">HỌC TIẾNG ANH</div>

        <div class="description">
            Trang giới thiệu
            <span>Bạn muốn tiếp tục sử dụng?</span>
        </div>

        <button class="btn-continue">Tiếp tục</button>
    </div>

    <script>
        document.querySelector('.btn-continue').addEventListener('click', function () {
            window.webkit.messageHandlers.nativeBridge.postMessage({
                action: "open-native",
                data: {}
            });
        });
    </script>

</body>
</html>
