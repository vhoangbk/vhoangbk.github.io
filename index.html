<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .phone-container {
            width: 260px;
            height: 320px;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            position: relative;
        }
        
        .icon-a {
            width: 45px;
            height: 45px;
            background-color: #e0f2e9;
            color: #1a6b54;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        .title {
            color: #1a6b54;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .description {
            text-align: center;
            color: #6b7a90;
            font-size: 12px;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .description span {
            display: block;
            color: #8896a6;
        }

        .btn-continue {
            background-color: #318e77;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-continue:hover {
            background-color: #27725f;
        }

        .hidden {
            display: none !important;
        }

        .musashi {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .musashi-icon {
            width: 48px;
            height: 48px;
            background-color: #dbe8f7;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        .musashi-name {
            color: #1f2e45;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div id="musashi" class="musashi hidden">
        <div class="musashi-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#4a90d9">
                <path d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
            </svg>
        </div>
        <div class="musashi-name">MUSASHI</div>
    </div>

    <div id="default-ui" class="phone-container hidden">

        <div class="icon-a">A</div>

        <div class="title">HỌC TIẾNG ANH</div>

        <div class="description">
            Trang giới thiệu
            <span>Bạn muốn tiếp tục sử dụng?</span>
        </div>

        <button class="btn-continue">Tiếp tục</button>
    </div>

    <script>
        // Kiểm tra IP: JP/VN -> giao diện MUSASHI, ngược lại -> giao diện mặc định
        (async function () {
            let showMusashi = true;
            // Thử lần lượt các dịch vụ, mỗi dịch vụ trả về mã quốc gia theo cách riêng
            const providers = [
                { url: 'https://api.country.is/', get: d => d.country },
                { url: 'https://ipwho.is/', get: d => d.success === false ? null : d.country_code },
                { url: 'https://ipapi.co/json/', get: d => d.error ? null : d.country_code }
            ];
            for (const p of providers) {
                try {
                    const res = await fetch(p.url);
                    if (!res.ok) continue;
                    const code = p.get(await res.json());
                    console.log(code)
                    if (code) {
                        showMusashi = ['JP', 'VN'].includes(code);
                        break;
                    }
                } catch (e) {
                    // thử dịch vụ tiếp theo
                }
            }
            document.getElementById(showMusashi ? 'musashi' : 'default-ui').classList.remove('hidden');
        })();

        document.querySelector('.btn-continue').addEventListener('click', function () {
            window.webkit.messageHandlers.nativeBridge.postMessage({
                action: "open-native",
                data: {}
            });
        });
    </script>

</body>
</html>
